<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Inter Tight";
    font-style: normal;
    font-weight: 400;
    src: url("fonts/inter-tight-400.ttf") format("truetype");
  }
  @font-face {
    font-family: "Inter Tight";
    font-style: normal;
    font-weight: 500;
    src: url("fonts/inter-tight-500.ttf") format("truetype");
  }
  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    background: #070708;
    color: #F4F4F5;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lockup {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .mark {
    width: 132px;
    height: 132px;
    display: block;
  }
  h1 {
    margin: 32px 0 0;
    font-family: "Inter Tight", sans-serif;
    font-weight: 500;
    font-size: 196px;
    line-height: 0.9;
    letter-spacing: -0.05em;
    color: #F4F4F5;
  }
  p {
    margin: 20px 0 0;
    font-family: "Inter Tight", sans-serif;
    font-weight: 400;
    font-size: 26px;
    line-height: 1.2;
    letter-spacing: 0.04em;
    color: rgba(244, 244, 245, 0.62);
  }
</style>
</head>
<body>
  <div class="lockup">
    <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="15.2" fill="#000000" stroke="#F4F4F5" stroke-opacity="0.22" stroke-width="0.6"/>
      <clipPath id="disc">
        <circle cx="16" cy="16" r="15.2"/>
      </clipPath>
      <path clip-path="url(#disc)" d="M0 16.7 H7.4 L9.3 13.7 L11.5 16.7 L13.4 20.8 L16 6.6 L18.7 22.6 L21.1 16.7 L23.2 13.6 L25.2 16.7 H32" fill="none" stroke="#F4F4F5" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="16" cy="16.7" r="1.65" fill="#E4A94D"/>
    </svg>
    <h1>Helios</h1>
    <p>Medicare plan workspace</p>
  </div>
</body>
</html>
